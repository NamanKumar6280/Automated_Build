# .github/workflows/build-apk.yml
name: Build Unity APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    name: Extract & Build APK
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract Unity project ZIP
        run: |
          unzip -o UnityProject.zip -d extracted
          # If the zip contains a nested folder, move its contents up
          # so 'extracted' IS the Unity project root (has Assets/, ProjectSettings/, etc)
          if [ -d extracted/*/Assets ]; then
            mv extracted/*/* extracted/
          fi
          ls extracted

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: extracted/Library
          key: Library-${{ hashFiles('extracted/Assets/**') }}
          restore-keys: Library-
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: extracted
          targetPlatform: Android
          buildName: GeneratedProject
          versioning: None

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeneratedAPK
          path: build/Android
