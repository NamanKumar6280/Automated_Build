name: AI Unity Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # STEP 1: Unzip the Unity project
      # ------------------------------------------------------------
      - name: Unzip project
        run: python3 Scripts/unzip_project.py

      # ------------------------------------------------------------
      # STEP 2: Validate project structure
      # ------------------------------------------------------------
      - name: Validate Unity project
        run: python3 Scripts/validate_project.py

      # ------------------------------------------------------------
      # STEP 3: Extract Unity version and hash from ProjectVersion.txt
      # ------------------------------------------------------------
      - name: Read Unity version and hash
        id: unity-version
        run: |
          if [ ! -f "ProjectSettings/ProjectVersion.txt" ]; then
            echo "ERROR: ProjectVersion.txt not found!"
            exit 1
          fi
          VERSION_LINE=$(grep "m_EditorVersion" ProjectSettings/ProjectVersion.txt)
          VERSION=$(echo "$VERSION_LINE" | awk '{print $2}')
          HASH=$(echo "$VERSION_LINE" | awk '{print $3}' | tr -d '()')
          echo "VERSION=$VERSION"
          echo "HASH=$HASH"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # STEP 4: Install Unity with dependencies and xvfb
      # ------------------------------------------------------------
      - name: Install Unity
        run: |
          echo "Installing Unity ${{ steps.unity-version.outputs.version }} (hash: ${{ steps.unity-version.outputs.hash }})"
          # Install system dependencies
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1-mesa-glx libglu1-mesa \
            libxrandr2 libxcursor1 libxinerama1 \
            libxi6 libxext6 libxfixes3 \
            libx11-6 libxrender1 \
            xvfb \
            wget

          # Download Unity installer
          wget -q "https://download.unity3d.com/download_unity/${{ steps.unity-version.outputs.hash }}/UnitySetup-${{ steps.unity-version.outputs.version }}" \
            -O UnitySetup
          chmod +x UnitySetup

          # Install Unity headlessly using xvfb
          xvfb-run sudo ./UnitySetup --unattended --install-location /opt/unity --components=Unity,Android

          # Add Unity to PATH
          echo "/opt/unity/Editor" >> $GITHUB_PATH

          # Verify installation
          /opt/unity/Editor/Unity -version

      # ------------------------------------------------------------
      # STEP 5: Activate Unity license (if you have one)
      # ------------------------------------------------------------
      - name: Activate Unity License
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -serial ${{ secrets.UNITY_SERIAL }} \
            -username ${{ secrets.UNITY_USERNAME }} \
            -password ${{ secrets.UNITY_PASSWORD }} \
            -logFile /dev/null
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        continue-on-error: true   # Continue even if license fails (trial mode)

      # ------------------------------------------------------------
      # STEP 6: Compile scripts (headless)
      # ------------------------------------------------------------
      - name: Compile scripts
        id: compile
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.CompileOnly.Compile \
            -logFile compile.log
        continue-on-error: true

      - name: Parse compile errors
        if: always()
        run: python3 Scripts/parse_unity_log.py compile.log compile_errors.json

      - name: Generate AI Report (compile failure)
        if: steps.compile.outcome != 'success'
        run: |
          python3 Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --output AIReport.md
          python3 Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --json --output AIReport.json

      - name: Upload compile failure report
        if: steps.compile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-compile-failed
          path: |
            AIReport.md
            AIReport.json
            compile_errors.json
            compile.log

      - name: Fail workflow if compile fails
        if: steps.compile.outcome != 'success'
        run: exit 1

      # ------------------------------------------------------------
      # STEP 7: Run SetupRunner
      # ------------------------------------------------------------
      - name: Run SetupRunner
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Setup.SetupRunner.Run \
            -logFile setup.log

      # ------------------------------------------------------------
      # STEP 8: Validate generated assets
      # ------------------------------------------------------------
      - name: Validate generated assets
        run: python3 Scripts/validate_project.py --generated

      - name: Generate project report
        run: python3 Scripts/generate_project_report.py

      - name: Upload project report
        uses: actions/upload-artifact@v4
        with:
          name: project-report
          path: project_report.md

      # ------------------------------------------------------------
      # STEP 9: Build Android APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Build.BuildScript.BuildAndroid \
            -logFile build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfLife.apk
          path: Builds/*.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # STEP 10: Final AI Report
      # ------------------------------------------------------------
      - name: Generate final AI report
        if: always()
        run: |
          SIZE=$(stat -c%s Builds/*.apk 2>/dev/null || echo "0")
          TIME=$(grep -o "Build completed in [0-9.]* seconds" build.log 2>/dev/null | awk '{print $4}' || echo "unknown")
          python3 Scripts/generate_ai_report.py \
            --success \
            --apk-size "$SIZE" \
            --build-time "$TIME" \
            --output AIReport.md

      - name: Upload final AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ai-report
          path: AIReport.md
