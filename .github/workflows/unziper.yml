name: Build Android APK (Debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    ##########################################################
    # Checkout
    ##########################################################

    - uses: actions/checkout@v4

    ##########################################################
    # Extract ZIP
    ##########################################################

    - name: Extract Unity Project
      run: |
        python3 << EOF
        import zipfile
        import glob
        import os
        import sys

        zips=glob.glob("*.zip")

        if not zips:
            raise Exception("No ZIP found.")

        with zipfile.ZipFile(zips[0]) as z:
            z.extractall(".")

        print("ZIP Extracted")
        EOF

    ##########################################################
    # Show Folder Structure
    ##########################################################

    - name: Show Repository
      run: |
        pwd
        find . -maxdepth 5

    ##########################################################
    # Run SetupRunner
    ##########################################################

    - name: Run SetupRunner
      uses: game-ci/unity-builder@v4
      continue-on-error: true

      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      with:
        unityVersion: 6000.0.35f1
        projectPath: .
        targetPlatform: Android
        buildMethod: ShelfLife.Editor.Setup.SetupRunner.Run
        versioning: None

    ##########################################################
    # Show Generated Assets
    ##########################################################

    - name: List Generated Assets
      if: always()
      run: |
        echo "========== SCENES =========="
        find Assets -name "*.unity"

        echo ""
        echo "========== PREFABS =========="
        find Assets -name "*.prefab"

        echo ""
        echo "========== SCRIPTABLE OBJECTS =========="
        find Assets -name "*.asset"

    ##########################################################
    # Build APK
    ##########################################################

    - name: Build APK
      uses: game-ci/unity-builder@v4
      continue-on-error: true

      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      with:
        unityVersion: 6000.0.35f1
        projectPath: .
        targetPlatform: Android
        buildMethod: ShelfLife.Editor.Build.BuildScript.BuildAndroid
        versioning: None

    ##########################################################
    # Print Unity Logs
    ##########################################################

    - name: Print Unity Logs
      if: always()
      run: |
        echo "=========================="
        echo "UNITY LOGS"
        echo "=========================="

        find /root -name "Editor.log"

        for f in $(find /root -name "Editor.log")
        do
          echo ""
          echo "====================================="
          echo "$f"
          echo "====================================="
          cat "$f"
        done

    ##########################################################
    # Search Compiler Errors
    ##########################################################

    - name: Extract Compiler Errors
      if: always()
      run: |
        echo ""
        echo "=========== ERRORS ==========="

        grep -R "error CS" /root || true

        grep -R "Exception" /root || true

        grep -R "Build failed" /root || true

        grep -R "Scripts have compiler errors" /root || true

    ##########################################################
    # Upload Entire Unity Log
    ##########################################################

    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4

      with:
        name: UnityLogs

        path: |
          /root/.config/unity3d/Editor.log
          /root/.config/unity3d/**/*.log

    ##########################################################
    # Upload Generated Project
    ##########################################################

    - name: Upload Generated Project
      if: always()
      uses: actions/upload-artifact@v4

      with:
        name: GeneratedProject

        path: |
          Assets
          Packages
          ProjectSettings

    ##########################################################
    # Upload APK
    ##########################################################

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4

      with:
        name: APK

        path: |
          Builds
          **/*.apk
