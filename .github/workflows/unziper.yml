name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # Extract uploaded Unity ZIP
      ########################################################

      - name: Extract Unity Project
        run: |
          python3 << 'EOF'
          import zipfile
          import glob
          import os
          import shutil
          import sys

          zips = glob.glob("*.zip")

          if not zips:
              print("No zip found.")
              sys.exit(1)

          zip_file = zips[0]

          print("Using:", zip_file)

          if os.path.exists("project"):
              shutil.rmtree("project")

          os.makedirs("project", exist_ok=True)

          with zipfile.ZipFile(zip_file) as z:
              z.extractall("project")

          print("Extraction Complete")
          EOF

      ########################################################
      # Generate scenes, prefabs, ScriptableObjects, etc.
      ########################################################

      - name: Generate Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

        with:
          unityVersion: 6000.0.35f1
          projectPath: project
          targetPlatform: Android
          buildMethod: ShelfLife.Editor.Setup.SetupRunner.Run

      ########################################################
      # Build APK
      ########################################################

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

        with:
          unityVersion: 6000.0.35f1
          projectPath: project
          targetPlatform: Android
          buildMethod: ShelfLife.Editor.Build.BuildScript.BuildAndroid

      ########################################################
      # Upload APK
      ########################################################

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: ShelfLife-APK
          path: project/Builds/*.apk
