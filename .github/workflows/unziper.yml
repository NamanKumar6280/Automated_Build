name: AI Unity Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # STEP 1: Validate project structure BEFORE Unity runs
      # ------------------------------------------------------------
      - name: Validate Unity project
        run: python Scripts/validate_project.py
        continue-on-error: false

      # ------------------------------------------------------------
      # STEP 2: Install Unity (using RageAgainstThePixel)
      # ------------------------------------------------------------
      - name: Install Unity
        id: unity-install
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          version-file: 'ProjectSettings/ProjectVersion.txt'
          build-targets: Android
          cache-installation: true

      # ------------------------------------------------------------
      # STEP 3: Activate Unity license (using RageAgainstThePixel)
      # ------------------------------------------------------------
      - name: Activate Unity License
        uses: RageAgainstThePixel/unity-activate@v2
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # ------------------------------------------------------------
      # STEP 4: Compile only – capture compiler errors
      # ------------------------------------------------------------
      - name: Compile scripts (headless)
        id: compile
        run: |
          ${{ env.UNITY_EDITOR_PATH }} \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.CompileOnly.Compile \
            -logFile compile.log
        continue-on-error: true

      - name: Parse compile errors
        run: python Scripts/parse_unity_log.py compile.log compile_errors.json
        if: always()

      # ------------------------------------------------------------
      # STEP 5: If compile fails, generate AI report and stop
      # ------------------------------------------------------------
      - name: Generate AI Report (compile failure)
        if: steps.compile.outcome != 'success'
        run: |
          python Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --output AIReport.md
          python Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --json --output AIReport.json

      - name: Upload compile failure report
        if: steps.compile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-compile-failed
          path: |
            AIReport.md
            AIReport.json
            compile_errors.json
            compile.log

      - name: Fail workflow if compile fails
        if: steps.compile.outcome != 'success'
        run: exit 1

      # ------------------------------------------------------------
      # STEP 6: Run SetupRunner (generates scenes, prefabs, assets)
      # ------------------------------------------------------------
      - name: Run SetupRunner
        run: |
          ${{ env.UNITY_EDITOR_PATH }} \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Setup.SetupRunner.Run \
            -logFile setup.log

      # ------------------------------------------------------------
      # STEP 7: Validate generated assets
      # ------------------------------------------------------------
      - name: Validate generated assets
        run: python Scripts/validate_project.py --generated

      - name: Generate project report
        run: python Scripts/generate_project_report.py

      - name: Upload project report
        uses: actions/upload-artifact@v4
        with:
          name: project-report
          path: project_report.md

      # ------------------------------------------------------------
      # STEP 8: Build Android APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          ${{ env.UNITY_EDITOR_PATH }} \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Build.BuildScript.BuildAndroid \
            -logFile build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfLife.apk
          path: Builds/*.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # STEP 9: Final AI Report (success)
      # ------------------------------------------------------------
      - name: Generate final AI report
        if: always()
        run: |
          python Scripts/generate_ai_report.py \
            --success \
            --apk-size $(stat -c%s Builds/*.apk 2>/dev/null || echo 0) \
            --build-time $(grep -o "Build completed in [0-9.]* seconds" build.log | awk '{print $4}' || echo "unknown") \
            --output AIReport.md

      - name: Upload final AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ai-report
          path: AIReport.md
