name: AI Unity Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # STEP 1: Validate project structure BEFORE Unity runs
      # ------------------------------------------------------------
      - name: Validate Unity project
        run: python Scripts/validate_project.py
        continue-on-error: false

      # ------------------------------------------------------------
      # STEP 2: Install Unity (cached)
      # ------------------------------------------------------------
      - name: Cache Unity
        uses: actions/cache@v3
        with:
          path: /opt/unity
          key: unity-6000.0.35f1-android

      - name: Install Unity
        uses: game-ci/unity-setup@v2
        with:
          version: 6000.0.35f1
          components: android

      - name: Activate Unity license
        uses: game-ci/unity-activate@v2
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_EMAIL }}
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      # ------------------------------------------------------------
      # STEP 3: Compile only – capture compiler errors
      # ------------------------------------------------------------
      - name: Compile scripts (headless)
        id: compile
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.CompileOnly.Compile \
            -logFile compile.log \
            -silent-crashes
          echo "UNITY_EXIT_CODE=$?" >> $GITHUB_ENV
        continue-on-error: true

      - name: Parse compile errors
        run: python Scripts/parse_unity_log.py compile.log compile_errors.json
        if: always()

      # ------------------------------------------------------------
      # STEP 4: If compile fails, generate AI report and stop
      # ------------------------------------------------------------
      - name: Generate AI Report (compile failure)
        if: env.UNITY_EXIT_CODE != 0
        run: |
          python Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --output AIReport.md
          # Also generate JSON for AI
          python Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --json --output AIReport.json

      - name: Upload compile failure report
        if: env.UNITY_EXIT_CODE != 0
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-compile-failed
          path: |
            AIReport.md
            AIReport.json
            compile_errors.json
            compile.log

      - name: Fail workflow if compile fails
        if: env.UNITY_EXIT_CODE != 0
        run: exit 1

      # ------------------------------------------------------------
      # STEP 5: Run SetupRunner (generates scenes, prefabs, assets)
      # ------------------------------------------------------------
      - name: Run SetupRunner
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Setup.SetupRunner.Run \
            -logFile setup.log

      # ------------------------------------------------------------
      # STEP 6: Validate generated assets (scenes, prefabs, etc.)
      # ------------------------------------------------------------
      - name: Validate generated assets
        run: python Scripts/validate_project.py --generated

      - name: Generate project report
        run: python Scripts/generate_project_report.py

      - name: Upload project report
        uses: actions/upload-artifact@v4
        with:
          name: project-report
          path: project_report.md

      # ------------------------------------------------------------
      # STEP 7: Build Android APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Build.BuildScript.BuildAndroid \
            -logFile build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfLife.apk
          path: Builds/*.apk

      # ------------------------------------------------------------
      # STEP 8: Final AI Report (success)
      # ------------------------------------------------------------
      - name: Generate final AI report
        run: |
          python Scripts/generate_ai_report.py \
            --success \
            --apk-size $(ls -l Builds/*.apk | awk '{print $5}') \
            --build-time $(cat build.log | grep "Build completed" | awk '{print $4}') \
            --output AIReport.md

      - name: Upload final AI report
        uses: actions/upload-artifact@v4
        with:
          name: final-ai-report
          path: AIReport.md
