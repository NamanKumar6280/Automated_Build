name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # Extract Unity ZIP into repository root
      ########################################################

      - name: Extract Unity Project
        run: |
          python3 << 'EOF'
          import zipfile
          import glob
          import os
          import sys

          zips = glob.glob("*.zip")

          if not zips:
              print("No zip file found.")
              sys.exit(1)

          zip_file = zips[0]

          print(f"Using ZIP: {zip_file}")

          with zipfile.ZipFile(zip_file, "r") as z:
              z.extractall(".")

          print("Extraction completed.")
          EOF

      ########################################################
      # Show extracted files (debug)
      ########################################################

      - name: Verify Extraction
        run: |
          echo "Repository root:"
          ls -la

          echo ""
          echo "Unity folders:"
          find . -maxdepth 2 -type d

      ########################################################
      # Generate project (SetupRunner)
      ########################################################

      - name: Run SetupRunner
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.0.35f1
          projectPath: .
          targetPlatform: Android
          buildMethod: ShelfLife.Editor.Setup.SetupRunner.Run
          versioning: None

      ########################################################
      # Build APK
      ########################################################

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.0.35f1
          projectPath: .
          targetPlatform: Android
          buildMethod: ShelfLife.Editor.Build.BuildScript.BuildAndroid
          versioning: None

      ########################################################
      # Upload APK
      ########################################################

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfLife-APK
          path: Builds/**/*.apk
