name: AI Unity Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # STEP 1: Unzip the Unity project
      # ------------------------------------------------------------
      - name: Unzip project
        run: python3 Scripts/unzip_project.py

      # ------------------------------------------------------------
      # STEP 2: Validate project structure
      # ------------------------------------------------------------
      - name: Validate Unity project
        run: python3 Scripts/validate_project.py

      # ------------------------------------------------------------
      # STEP 3: Install Unity manually (Linux)
      # ------------------------------------------------------------
      - name: Install Unity 6000.0.35f1
        run: |
          # Download Unity installer (Linux)
          wget -q https://download.unity3d.com/download_unity/6000.0.35f1/UnitySetup-6000.0.35f1 \
            -O UnitySetup
          chmod +x UnitySetup
          # Install to /opt/unity
          sudo mkdir -p /opt/unity
          sudo ./UnitySetup --unattended --install-location /opt/unity
          # Add Unity to PATH
          echo "/opt/unity/Editor" >> $GITHUB_PATH
          # Verify installation
          /opt/unity/Editor/Unity -version

      # ------------------------------------------------------------
      # STEP 4: Install Android build support (optional but recommended)
      # ------------------------------------------------------------
      - name: Install Android components
        run: |
          # Download Android module installer
          wget -q https://download.unity3d.com/download_unity/6000.0.35f1/UnitySetup-Android-Support-for-Editor-6000.0.35f1 \
            -O AndroidSetup
          chmod +x AndroidSetup
          sudo ./AndroidSetup --unattended --install-location /opt/unity

      # ------------------------------------------------------------
      # STEP 5: Activate Unity license (if you have a license)
      # ------------------------------------------------------------
      - name: Activate Unity License
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -serial ${{ secrets.UNITY_SERIAL }} \
            -username ${{ secrets.UNITY_USERNAME }} \
            -password ${{ secrets.UNITY_PASSWORD }} \
            -logFile /dev/null
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        continue-on-error: true   # Allows build to proceed even if activation fails (trial mode)

      # ------------------------------------------------------------
      # STEP 6: Compile scripts (headless)
      # ------------------------------------------------------------
      - name: Compile scripts
        id: compile
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.CompileOnly.Compile \
            -logFile compile.log
        continue-on-error: true

      - name: Parse compile errors
        if: always()
        run: python3 Scripts/parse_unity_log.py compile.log compile_errors.json

      - name: Generate AI Report (compile failure)
        if: steps.compile.outcome != 'success'
        run: |
          python3 Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --output AIReport.md
          python3 Scripts/generate_ai_report.py \
            --compile-errors compile_errors.json \
            --json --output AIReport.json

      - name: Upload compile failure report
        if: steps.compile.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-compile-failed
          path: |
            AIReport.md
            AIReport.json
            compile_errors.json
            compile.log

      - name: Fail workflow if compile fails
        if: steps.compile.outcome != 'success'
        run: exit 1

      # ------------------------------------------------------------
      # STEP 7: Run SetupRunner
      # ------------------------------------------------------------
      - name: Run SetupRunner
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Setup.SetupRunner.Run \
            -logFile setup.log

      # ------------------------------------------------------------
      # STEP 8: Validate generated assets
      # ------------------------------------------------------------
      - name: Validate generated assets
        run: python3 Scripts/validate_project.py --generated

      - name: Generate project report
        run: python3 Scripts/generate_project_report.py

      - name: Upload project report
        uses: actions/upload-artifact@v4
        with:
          name: project-report
          path: project_report.md

      # ------------------------------------------------------------
      # STEP 9: Build Android APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          /opt/unity/Editor/Unity \
            -batchmode -nographics -quit \
            -projectPath $GITHUB_WORKSPACE \
            -executeMethod ShelfLife.Editor.Build.BuildScript.BuildAndroid \
            -logFile build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShelfLife.apk
          path: Builds/*.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # STEP 10: Final AI Report
      # ------------------------------------------------------------
      - name: Generate final AI report
        if: always()
        run: |
          SIZE=$(stat -c%s Builds/*.apk 2>/dev/null || echo "0")
          TIME=$(grep -o "Build completed in [0-9.]* seconds" build.log 2>/dev/null | awk '{print $4}' || echo "unknown")
          python3 Scripts/generate_ai_report.py \
            --success \
            --apk-size "$SIZE" \
            --build-time "$TIME" \
            --output AIReport.md

      - name: Upload final AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ai-report
          path: AIReport.md
